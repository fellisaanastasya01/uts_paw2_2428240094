$kind: http-request
method: POST
url: '{{base_url}}/ras'
order: 3000
description: |
  Tambah ras. 201 sukses, 400 bila nama/asalDaerah kosong, 409 bila nama duplikat.
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "nama": "Bali-{{$timestamp}}",
      "asalDaerah": "Bali"
    }
