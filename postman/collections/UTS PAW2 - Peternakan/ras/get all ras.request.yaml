$kind: http-request
method: GET
url: '{{base_url}}/ras'
order: 1000
description: |
  Semua ras, urut nama menaik. Respons array dokumen ras.
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const data = pm.response.json();
      const austria = data.find((d) => d.nama === 'Austria') || data[0];
      if (austria) {
          pm.environment.set('ras_id', austria._id);
          console.log('[OK] ras_id =', austria._id, '(' + austria.nama + ')');
      }
